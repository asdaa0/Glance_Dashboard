# =======================
# SERVER SETTINGS
# =======================

# https://github.com/glanceapp/glance/blob/main/docs/configuration.md#server
server:
  proxied: true
  base-url: /glance
  port: ${PORT}

# =======================
# AUTHENTICATION SETTINGS
# =======================

# https://github.com/glanceapp/glance/blob/main/docs/configuration.md#authentication
auth:
  secret-key: ${GLANCE_SECRET_KEY}
  users:
    ${GLANCE_USERNAME}:
      password-hash: ${GLANCE_PASSWORD_HASH}

# =======================
# BRANDING SETTINGS
# =======================

# https://github.com/glanceapp/glance/blob/main/docs/configuration.md#branding
branding:
  hide-footer: true

# =======================
# THEME SETTINGS
# =======================

# https://github.com/glanceapp/glance/blob/main/docs/configuration.md#the-config-file
theme:
  $include: theme.yml


# =======================
# PAGES
# =======================

# https://github.com/glanceapp/glance/blob/main/docs/configuration.md#the-config-file

pages:
  - $include: home.yml
  - $include: markets.yml
  - $include: rss.yml
#  - $include: hosting.yml
#  - $include: games.yml
#  - $include: sports.yml
